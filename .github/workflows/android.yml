name: Android

# Builds the MusicCraft APKs for phones and tablets (docs/android.md):
# arm64-v8a (modern ARM phones) and armeabi-v7a (older 32-bit ARM), through
# cargo-apk. Runs on pushes that touch the Android pieces, on pull requests,
# and by hand from the Actions tab. APKs land in the run's artifacts and,
# for main-branch builds, in the rolling `android` pre-release on the
# Releases tab (https://github.com/danzfadlullah/musiccraft/releases/tag/android).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-file-dialog/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-file-dialog/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: debug APKs are big, but logcat and the log file show everything"
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK platform and NDK
        # The hosted runner ships the Android SDK with the command-line tools
        # (ANDROID_HOME points at it); the NDK and the platform cargo-apk
        # builds against come here.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Restore the signing keystore
        # The persistent test keystore is committed, so every run signs with
        # the same key and new APKs install over previous ones. If the repo
        # defines the KEYSTORE_BASE64 and KEYSTORE_PASSWORD Actions secrets
        # (a kept key, docs/android.md), those win; anything else falls back
        # to a throwaway key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > crates/musiccraft-android/release.keystore
            sed -i "s|keystore_password = \".*\"|keystore_password = \"${KEYSTORE_PASSWORD}\"|" \
              crates/musiccraft-android/Cargo.toml
            echo "SIGNING=persistent" >> "$GITHUB_ENV"
            echo "Signing with the keystore from the Actions secrets."
          elif [ -f crates/musiccraft-android/release.keystore ]; then
            echo "SIGNING=committed" >> "$GITHUB_ENV"
            echo "Signing with the committed test keystore."
          else
            keytool -genkeypair -v -keystore crates/musiccraft-android/release.keystore \
              -alias musiccraft -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass musiccraft-ci -keypass musiccraft-ci \
              -dname "CN=MusicCraft CI, O=MusicCraft, C=ID"
            echo "SIGNING=throwaway" >> "$GITHUB_ENV"
            echo "No keystore found: signing with a throwaway key."
          fi
      - name: Build the APK
        run: |
          if [ "${{ github.event.inputs.profile }}" = "debug" ]; then
            cargo apk build -p musiccraft-android
          else
            cargo apk build -p musiccraft-android --release
          fi
      - name: Collect the APK
        # One APK carrying both ARM ABIs (cargo-apk packs every
        # `build_targets` entry into it).
        run: |
          mkdir -p dist
          if [ "${{ github.event.inputs.profile }}" = "debug" ]; then
            cp target/debug/apk/MusicCraft.apk dist/MusicCraft-android-debug.apk
          else
            cp target/release/apk/MusicCraft.apk dist/MusicCraft-android.apk
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCraft-Android-APK
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish the rolling pre-release
        # Every build of main refreshes the `android` pre-release on the
        # Releases tab, so there is one stable download address. Debug
        # builds and pull requests do not publish.
        if: >-
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'debug') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automatic test build of ${GITHUB_SHA}."
            echo
            echo "- One APK for arm64-v8a and armeabi-v7a; Android 10 or newer."
            if [ "$SIGNING" = throwaway ]; then
              echo "- Signed with a throwaway CI key: uninstall any earlier build before installing this one."
            else
              echo "- Signed with the persistent CI key: installs over any earlier build, no uninstall needed."
            fi
            echo "- Pre-release: for testing, not for the store. See docs/android.md."
          } > dist/notes.md
          gh release delete android --yes --cleanup-tag || true
          gh release create android "dist/MusicCraft-android.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MusicCraft for Android (auto-build)" \
            --notes-file dist/notes.md

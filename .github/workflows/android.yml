name: Android

# Builds the MusicCraft APKs for phones and tablets (docs/android.md):
# arm64-v8a (modern ARM phones) and armeabi-v7a (older 32-bit ARM), through
# cargo-apk. Runs on pushes that touch the Android pieces, on pull requests,
# and by hand from the Actions tab. APKs land in the run's artifacts and,
# for main-branch builds, in the rolling `android` pre-release on the
# Releases tab (https://github.com/danzfadlullah/musiccraft/releases/tag/android).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-android-java/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-delta/**"
      - "crates/musiccraft-file-dialog/**"
      - "crates/musiccraft-soundfont/**"
      - "crates/musiccraft-default-soundfont/**"
      - "crates/musiccraft-commands/**"
      - "crates/musiccraft-samples/**"
      - "crates/musiccraft-instruments/**"
      - "crates/musiccraft-dsp/**"
      - "crates/musiccraft-ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-android-java/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-delta/**"
      - "crates/musiccraft-file-dialog/**"
      - "crates/musiccraft-soundfont/**"
      - "crates/musiccraft-default-soundfont/**"
      - "crates/musiccraft-commands/**"
      - "crates/musiccraft-samples/**"
      - "crates/musiccraft-instruments/**"
      - "crates/musiccraft-dsp/**"
      - "crates/musiccraft-ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: debug APKs are big, but logcat and the log file show everything"
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history, so the release notes can list the commits since the
        # previous release.
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK platform and NDK
        # The hosted runner ships the Android SDK with the command-line tools
        # (ANDROID_HOME points at it); the NDK and the platform cargo-apk
        # builds against come here.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Compile the activity's Java subclass
        # MusicCraftActivity receives the SAF picker's answer for the native
        # code (docs/android.md): javac compiles it, d8 turns it into a
        # classes.dex that gets injected into the APK below, because
        # cargo-apk has no dex support of its own.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/classes build/dex
          javac -source 1.8 -target 1.8 -nowarn \
            -classpath "${ANDROID_HOME}/platforms/android-34/android.jar" \
            -d build/classes \
            crates/musiccraft-android/java/io/github/bhimio1/musiccraft/MusicCraftActivity.java
          "${ANDROID_HOME}/build-tools/34.0.0/d8" --release --min-api 29 \
            --lib "${ANDROID_HOME}/platforms/android-34/android.jar" \
            --output build/dex \
            build/classes/io/github/bhimio1/musiccraft/MusicCraftActivity.class
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Restore the signing keystore
        # The persistent test keystore is committed, so every run signs with
        # the same key and new APKs install over previous ones. If the repo
        # defines the KEYSTORE_BASE64 and KEYSTORE_PASSWORD Actions secrets
        # (a kept key, docs/android.md), those win; anything else falls back
        # to a throwaway key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > crates/musiccraft-android/release.keystore
            sed -i "s|keystore_password = \".*\"|keystore_password = \"${KEYSTORE_PASSWORD}\"|" \
              crates/musiccraft-android/Cargo.toml
            echo "SIGNING=persistent" >> "$GITHUB_ENV"
            echo "Signing with the keystore from the Actions secrets."
          elif [ -f crates/musiccraft-android/release.keystore ]; then
            echo "SIGNING=committed" >> "$GITHUB_ENV"
            echo "Signing with the committed test keystore."
          else
            keytool -genkeypair -v -keystore crates/musiccraft-android/release.keystore \
              -alias musiccraft -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass musiccraft-ci -keypass musiccraft-ci \
              -dname "CN=MusicCraft CI, O=MusicCraft, C=ID"
            echo "SIGNING=throwaway" >> "$GITHUB_ENV"
            echo "No keystore found: signing with a throwaway key."
          fi
      - name: Build the APK
        env:
          # Stamped into the APK so its update check can tell itself from
          # the newest build on the Releases tab.
          MUSICCRAFT_BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event.inputs.profile }}" = "debug" ]; then
            cargo apk build -p musiccraft-android
          else
            cargo apk build -p musiccraft-android --release
          fi
      - name: Collect the APK
        # One APK carrying both ARM ABIs (cargo-apk packs every
        # `build_targets` entry into it). The activity's classes.dex is
        # injected by zip, then the APK is realigned and re-signed, because
        # both break the archive's signature.
        run: |
          mkdir -p dist
          if [ "${{ github.event.inputs.profile }}" = "debug" ]; then
            APK=target/debug/apk/MusicCraft.apk
            cp "$APK" dist/MusicCraft-android-debug.apk
            APK=dist/MusicCraft-android-debug.apk
          else
            APK=target/release/apk/MusicCraft.apk
            cp "$APK" dist/MusicCraft-android.apk
            APK=dist/MusicCraft-android.apk
          fi
          cp build/dex/classes.dex .
          zip -q "$APK" classes.dex
          rm classes.dex
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -f -p 4 "$APK" aligned.apk
          mv aligned.apk "$APK"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" sign \
            --ks crates/musiccraft-android/release.keystore \
            --ks-pass "pass:${KEYSTORE_PASSWORD:-musiccraft-ci}" \
            --min-sdk-version 29 "$APK"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify "$APK"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCraft-Android-APK
          path: dist/*.apk
          if-no-files-found: error
      - name: Build the delta patches
        # The updater can rebuild the new APK from the installed one instead
        # of downloading the whole APK again: a bsdiff patch per recent base
        # version (docs/android.md, "Delta updates"). The base APKs live on
        # the `android-bases` branch; the patches and their manifest
        # (`android-patches.json`) join the release as extra assets. A
        # version with no patch here — the first build, or more than eight
        # releases behind — updates by the full download.
        if: >-
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'debug') }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          APK=dist/MusicCraft-android.apk
          mkdir -p patch-work/bases patch-work/patches dist/patches
          cp "$APK" "patch-work/bases/${VERSION}.apk"
          if git ls-remote --exit-code --heads origin android-bases > /dev/null 2>&1; then
            git fetch --force origin android-bases:android-bases
            for name in $(git ls-tree --name-only android-bases:bases); do
              git show "android-bases:bases/$name" > "patch-work/bases/$name"
            done
          fi
          # Only the newest eight bases matter; older ones fall back to the
          # full download, and the branch drops them.
          cd patch-work
          KEEP=$(ls bases | sort -V | tail -n 8)
          cargo build --release -p musiccraft-delta --locked
          ENTRIES=""
          for name in $KEEP; do
            BASE=${name%.apk}
            [ "$BASE" = "$VERSION" ] && continue
            OUT="patches/MusicCraft-android-${BASE}-to-${VERSION}.patch"
            if ../target/release/musiccraft-delta make "bases/$name" "$APK" "$OUT"; then
              # Prove the patch rebuilds the target exactly.
              ../target/release/musiccraft-delta apply "bases/$name" "$OUT" rebuilt.apk
              if ! cmp -s rebuilt.apk "$APK"; then
                echo "patch $OUT does not rebuild the target; dropping it"
                rm -f "$OUT"
                continue
              fi
              BASE_SHA=$(sha256sum "bases/$name" | cut -d' ' -f1)
              SIZE=$(stat -c%s "$OUT")
              ENTRY="{\"base\":\"$BASE\",\"base_sha256\":\"sha256:$BASE_SHA\",\"name\":\"${OUT##*/}\",\"size\":$SIZE}"
              if [ -n "$ENTRIES" ]; then ENTRIES="$ENTRIES,$ENTRY"; else ENTRIES="$ENTRY"; fi
              echo "patch for $BASE: $SIZE bytes"
            fi
          done
          TARGET_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '{"target":"%s","target_sha256":"sha256:%s","patches":[%s]}\n' \
            "$VERSION" "$TARGET_SHA" "$ENTRIES" > ../dist/android-patches.json
          cp patches/*.patch ../dist/patches/ 2>/dev/null || true
          cd ..
          cat dist/android-patches.json
      - name: Refresh the base APKs branch
        if: >-
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'debug') }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if git ls-remote --exit-code --heads origin android-bases > /dev/null 2>&1; then
            git fetch --force origin android-bases:android-bases
            git worktree add bases-tree android-bases
          else
            git worktree add --orphan -b android-bases bases-tree
          fi
          mkdir -p bases-tree/bases
          cp dist/MusicCraft-android.apk "bases-tree/bases/${VERSION}.apk"
          cd bases-tree/bases
          ls | sort -V | head -n -8 | xargs -r rm -f
          cd ../..
          git -C bases-tree add -A
          if git -C bases-tree diff --cached --quiet; then
            echo "the base APKs did not change"
          else
            git -C bases-tree -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Base APKs for the delta updater (target ${VERSION})"
            git push origin android-bases
          fi
      - name: Publish the rolling pre-release
        # Every build of main refreshes the `android` pre-release on the
        # Releases tab, so there is one stable download address. Debug
        # builds and pull requests do not publish.
        if: >-
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'debug') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app's own update check reads this line from the release
          # notes to compare semantic versions, and the Changes section is
          # the changelog its update pop-up shows.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android" \
            --jq .target_commitish 2>/dev/null || true)
          RANGE="-20"
          if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then
            RANGE="$PREV..$GITHUB_SHA"
          fi
          {
            echo "Version: ${VERSION} (commit ${GITHUB_SHA:0:7})"
            echo
            echo "Automatic test build of ${GITHUB_SHA}."
            echo
            echo "- One APK for arm64-v8a and armeabi-v7a; Android 10 or newer."
            if [ "$SIGNING" = throwaway ]; then
              echo "- Signed with a throwaway CI key: uninstall any earlier build before installing this one."
            else
              echo "- Signed with the persistent CI key: installs over any earlier build, no uninstall needed."
            fi
            echo "- Pre-release: for testing, not for the store. See docs/android.md."
            echo "- Delta updates: when this release carries a patch for the installed version, the app rebuilds the update from the installed APK and downloads only what changed."
            echo
            echo "Changes:"
            git log --no-decorate --format='- %s' --max-count=20 "$RANGE" \
              || echo "- (the commit list could not be made)"
          } > dist/notes.md
          gh release delete android --yes --cleanup-tag || true
          ASSETS=("dist/MusicCraft-android.apk" "dist/android-patches.json")
          for f in dist/patches/*.patch; do
            [ -e "$f" ] && ASSETS+=("$f")
          done
          gh release create android "${ASSETS[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MusicCraft for Android ${VERSION} (auto-build)" \
            --notes-file dist/notes.md

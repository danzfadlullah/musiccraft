name: Android

# Builds the MusicCraft APKs for phones and tablets (docs/android.md):
# arm64-v8a (modern ARM phones) and armeabi-v7a (older 32-bit ARM), through
# cargo-apk. Runs on pushes that touch the Android pieces, on pull requests,
# and by hand from the Actions tab. The APKs land in the run's artifacts;
# they are debug-signed, so first launch needs "install unknown apps".
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-file-dialog/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "crates/musiccraft-android/**"
      - "crates/musiccraft-app/**"
      - "crates/musiccraft-file-dialog/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: APK (arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-android@v3
      - name: Install the Android SDK platform and NDK
        # setup-android provides ANDROID_HOME with the command-line tools;
        # the NDK and the platform cargo-apk builds against come here.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build the APKs
        run: cargo apk build -p musiccraft-android --release
      - name: Collect the APKs
        run: |
          mkdir -p dist
          cp "target/aarch64-linux-android/release/apk/MusicCraft.apk" \
            "dist/MusicCraft-arm64-v8a.apk"
          cp "target/armv7-linux-androideabi/release/apk/MusicCraft.apk" \
            "dist/MusicCraft-armeabi-v7a.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCraft-APKs
          path: dist/*.apk
          if-no-files-found: error

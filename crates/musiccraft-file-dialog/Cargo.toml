[package]
name = "musiccraft-file-dialog"
description = "MusicCraft's native file dialogs, run without blocking the window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Attach dialogs to Wayland windows (needs libwayland-client, which the app
# opens at run time through winit's `dlopen`).
wayland = ["rfd/wayland"]

# Android has no backend in rfd, so the crate builds against the system's
# SAF panels there (see `src/lib.rs` and `docs/android.md`).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
musiccraft-android-java.workspace = true

[lints]
workspace = true

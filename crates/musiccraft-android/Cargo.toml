[package]
name = "musiccraft-android"
description = "MusicCraft Android entry point (NativeActivity)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The Android entry point must export `android_main` with a fixed name, which
# edition 2024 spells `#[unsafe(no_mangle)]`. That is the one deliberate
# exception to the workspace-wide `unsafe_code = "forbid"` (docs/android.md):
# this crate holds nothing but the entry point, so it does not inherit the
# workspace lints.

[lib]
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
musiccraft-app.workspace = true

[package.metadata.android]
# Built with `cargo apk build -p musiccraft-android --release`
# (docs/android.md); the GitHub Actions workflow android.yml builds the APKs.
package = "io.github.bhimio1.musiccraft"
apk_name = "MusicCraft"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
resources = "res"

[package.metadata.android.sdk]
# Android 10: AMidi (MIDI keyboards) and AAudio (audio output) both link.
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "MusicCraft"
icon = "@mipmap/ic_launcher"
# Test builds: keep the app debuggable so `adb logcat` shows everything.
debuggable = true
# The activity is a compiled Java subclass (crates/musiccraft-android/java),
# so the APK must carry a classes.dex: it receives the SAF picker's answer
# (docs/android.md).
has_code = true

[[package.metadata.android.uses_permission]]
# Lets the log folder in Downloads work on Android 10; harmless above.
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
# The in-app update check and APK download talk to the GitHub Releases API.
name = "android.permission.INTERNET"

# Android 11+ package visibility: without this declaration the app cannot
# see the system package installer, so opening the downloaded APK with
# ACTION_VIEW throws ActivityNotFoundException and the update never installs
# (docs/android.md).
[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]

[[package.metadata.android.queries.intent.data]]
mime_type = "application/vnd.android.package-archive"

[package.metadata.android.application.activity]
# The Java subclass that stows the SAF picker's answer for the native code.
name = "io.github.bhimio1.musiccraft.MusicCraftActivity"
# Landscape only: the DAW layout is built for a wide screen.
orientation = "sensorLandscape"
launch_mode = "singleTask"
# Keep the surface and the engine alive across rotations and keyboard slides.
config_changes = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|density|uiMode"

# The committed test keystore (see docs/android.md): every CI run signs with
# the same key, so new APKs install over old ones. It is for test builds
# only, never for a store release — point these at your own kept keystore
# instead (docs/android.md).
[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "musiccraft-ci"
